<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8e24aa" />
    <title>MzansiTalk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="welcome" class="screen active" aria-labelledby="welcome-title">
      <img src="./mzansitalk-logo.png" alt="MzansiTalk logo" class="logo" />
      <div>
        <h1 id="welcome-title">Welcome to Mzansi<span>Talk</span></h1>
        <p>Connect with South Africa</p>
      </div>
      <button id="start-chat" type="button">Start Chat</button>
      <p id="welcome-hint" class="hint"></p>
    </main>

    <main id="chat" class="screen" aria-labelledby="chat-title">
      <header>
        <img src="./mzansitalk-logo.png" alt="" class="mark" />
        <div><h1 id="chat-title">MzansiTalk</h1><p id="chat-sub">Connecting…</p></div>
      </header>
      <section class="offline-panel">
        <div class="status-dot"></div>
        <h2 id="state-title">Connecting to MzansiTalk…</h2>
        <p id="state-text">Checking your mobile data or WiFi connection.</p>
        <p id="state-error" class="error-detail"></p>
      </section>
      <button id="retry" type="button">Try again</button>
      <button id="back" class="secondary" type="button">Back to Welcome</button>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
