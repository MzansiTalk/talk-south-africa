name: Build Android APK v1.1
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install dependencies
        run: npm install
        
      - name: Bundle offline app assets
        run: npm run android:web
        
      - name: Add Android platform
        run: npx cap add android || npx cap sync android
        
      - name: Sync Capacitor
        run: npx cap sync

      - name: Set Android release version
        run: |
          sed -i 's/versionCode [0-9]\+/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.1"/' android/app/build.gradle

      - name: Create release signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/mzansitalk-release.jks" \
            -storepass android -keypass android \
            -alias mzansitalk -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MzansiTalk, OU=Mobile, O=MzansiTalk, L=Johannesburg, ST=Gauteng, C=ZA"

      - name: Restore permanent release signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mzansitalk-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configure release signing
        run: |
          cat >> android/gradle.properties <<EOF
          MZANSITALK_STORE_FILE=$RUNNER_TEMP/mzansitalk-release.jks
          MZANSITALK_STORE_PASSWORD=${KEYSTORE_PASSWORD:-android}
          MZANSITALK_KEY_ALIAS=${KEY_ALIAS:-mzansitalk}
          MZANSITALK_KEY_PASSWORD=${KEY_PASSWORD:-android}
          EOF
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        
      - name: Build production APK
        run: cd android && ./gradlew assembleRelease
        
      - uses: actions/upload-artifact@v4
        with:
          name: MzansiTalk-v1.1-release
          path: android/app/build/outputs/apk/release/app-release.apk
